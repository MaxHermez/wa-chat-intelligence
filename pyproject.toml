[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wain"
version = "0.1.1"
description = "Turn a WhatsApp export into a searchable, semantically-indexed knowledge base."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{name = "Max Hermez"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "openai>=1.0,<3",
    "faiss-cpu>=1.7",
    "numpy>=1.24",
    "python-dateutil>=2.8",
    "typer>=0.9",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "tomli-w>=1.2",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/maxhermez/wa-chat-intelligence"
Repository = "https://github.com/maxhermez/wa-chat-intelligence"
Issues = "https://github.com/maxhermez/wa-chat-intelligence/issues"

[project.scripts]
wain = "wain.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["wain*"]
